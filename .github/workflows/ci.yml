name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and frontend artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.25"

      - name: Install locked Python dependencies
        run: uv sync --frozen --all-groups

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend unit tests
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Run Python unit tests
        run: uv run pytest tests/unit

      - name: Run Python integration tests
        run: uv run pytest tests/integration

      - name: Install Chromium for browser tests
        run: uv run playwright install --with-deps chromium

      - name: Run Python end-to-end tests
        run: uv run pytest tests/e2e
        env:
          WIKIGRAPH_GRAPH_CLICK_DIAGNOSTICS: "1"

      - name: Run mypy
        run: uv run mypy src

      - name: Run Cloudflare Worker tests
        run: node --test cloudflare/worker.test.js

      - name: Upload graph click diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-click-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/graph-click/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload tested frontend static artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: src/wikigraph/static/
          if-no-files-found: error
          retention-days: 30
